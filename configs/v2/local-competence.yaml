    qualifying_rounds: 1
    rate: 0.1
  - name: moderate
    qualifying_rounds: 3
    rate: 0.2
  - name: high
    qualifying_rounds: 6
    rate: 0.4
  warning_template: warning-v2
  placebo_template: uncertainty-v2
  manual_enabled: false
  manual_max_chars: 2000
