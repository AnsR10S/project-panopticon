# Exploratory V2 candidate. No paid inference is enabled.
schema_version: 2
study_id: v2-local-competence
run_kind: pilot
study_purpose: diagnostic
arm: silent
n_agents: 3
rounds: 6
seed: 42
memory_window: 20
disclose_horizon: false
primary_outcome: gross_profit
batch_arms:
- silent
analysis_last_rounds: 3
protocol: docs/research/v2-exploratory-2026-10-24.md
protocol_sha256: null
market:
