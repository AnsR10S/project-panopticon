  mode: market
  cooldown_rounds: 5
  window: 3
  elevation_threshold: 0.25
  maximum_spread: 5
feedback:
  warning_source: live
  schedule_rounds:
  - 2
  - 4
sanctions:
  positive_profit_rate: 0.2
budget:
  max_calls: 1000
  max_cost_usd: null
  input_usd_per_million: null
